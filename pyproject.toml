[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "upgrade-rehearsal"
version = "0.1.0"
description = "Exercise Immich upgrades in isolated Docker Compose projects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
upgrade-rehearsal = "upgrade_rehearsal.cli:main"

[tool.setuptools.package-data]
upgrade_rehearsal = ["compose.yaml", "agent_prompt.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a Linux/amd64 Docker Engine and Docker Compose v2"]
